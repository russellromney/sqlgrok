name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLGLOT_REF: e6bcedb28ab30a050e524cc1a929d890290a0d94

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --features cli --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features cli

  curated-parity:
    name: sqlglot curated parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sqlgrok
        uses: actions/checkout@v5
        with:
          path: sqlgrok

      - name: Checkout Python SQLGlot
        uses: actions/checkout@v5
        with:
          repository: tobymao/sqlglot
          ref: ${{ env.SQLGLOT_REF }}
          path: sqlglot

      - uses: dtolnay/rust-toolchain@stable

      - name: Run curated parity corpus
        working-directory: sqlgrok
        env:
          SQLGLOT_PYTHON_PATH: ${{ github.workspace }}/sqlglot
        run: cargo test sqlglot_python_curated_parity --features cli -- --nocapture
